builders:
  skeleton_fake:
    import: "package:skeleton_faker_generator/builder.dart"
    builder_factories: ["skeletonFakeBuilder"]
    build_extensions: {".dart": [".skeleton_fake.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen:combining_builder"]

targets:
  $default:
    builders:
      skeleton_faker_generator:skeleton_fake:
        generate_for: ["test/**"]
